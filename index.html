<script>
(function(){
  var SUPABASE_URL="https://dunyftqkrjhjcnjzjprv.supabase.co";
  var SUPABASE_KEY="sb_publishable_J6SyWtIYW9u6gbWiFZcN-Q_sOd7pFSO";
  var PHONE="905542474500";
  var form=document.getElementById("orderForm");
  if(!form)return;
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var btn=form.querySelector('button[type="submit"]');
    var error=document.getElementById("order-error");
    if(!error){error=document.createElement("p");error.id="order-error";error.setAttribute("role","alert");error.style.cssText="color:#b00020;font-weight:bold;text-align:center";form.querySelector(".form-footer").appendChild(error);}
    var get=function(name){var el=form.querySelector('[name="'+name+'"]');return el?el.value.trim():"";};
    var selected=form.querySelector('input[name="adet"]:checked');
    var payment=form.querySelector('input[name="odeme"]:checked');
    var consent=form.querySelector('input[name="generalTerms"]');
    var tel=get("tel").replace(/\D/g,"");
    if(tel.length===12&&tel.indexOf("90")===0)tel="0"+tel.slice(2);
    if(tel.length===10&&tel.charAt(0)==="5")tel="0"+tel;
    if(!get("ad")||!get("adres")){error.textContent="Ad soyad ve açık adres alanlarını doldurun.";return;}
    if(!/^05\d{9}$/.test(tel)){error.textContent="Geçerli bir cep telefonu numarası girin.";return;}
    if(!selected||!payment){error.textContent="Ürün ve ödeme seçimini yapın.";return;}
    if(!consent||!consent.checked){error.textContent="Devam etmek için sözleşme ve gizlilik onayını verin.";return;}
    var match=selected.value.match(/([\d.]+)\s*TL/i);
    var amount=match?parseInt(match[1].replace(/\./g,""),10):null;
    if(amount===null||!Number.isFinite(amount)){error.textContent="Ürün fiyat bilgisi okunamadı.";return;}
    var paymentLabel=payment.value==="8"?"Kapıda Kredi Kartı İle":"Kapıda Nakit Ödeme";
    var payload={ad_soyad:get("ad"),telefon:tel,sehir_ilce:null,adres:get("adres"),urun:"Yeşil Zeytin - "+selected.value,toplam_tutar:amount,odeme_sekli:paymentLabel};
    btn.disabled=true;btn.textContent="Gönderiliyor...";error.textContent="";
    fetch(SUPABASE_URL+"/rest/v1/web_siparisler",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(payload)})
    .then(function(r){if(!r.ok)throw new Error("http "+r.status);form.innerHTML='<h2>Siparişiniz alındı</h2><p>Sipariş bilgileriniz bize ulaştı. İsterseniz WhatsApp’tan da ulaşabilirsiniz.</p><a class="button btn-primary" style="display:block;text-align:center" target="_blank" rel="noopener" href="https://wa.me/'+PHONE+'?text='+encodeURIComponent("Yeşil Zeytin siparişim hakkında yazıyorum")+'">WhatsApp’tan yaz</a>';form.scrollIntoView({behavior:"smooth",block:"start"});})
    .catch(function(){btn.disabled=false;btn.textContent="SİPARİŞİ ONAYLA";error.textContent="Sipariş gönderilemedi. Lütfen tekrar deneyin veya WhatsApp’tan bize ulaşın.";});
  });
})();
